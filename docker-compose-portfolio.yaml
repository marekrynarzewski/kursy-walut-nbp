services:
  nginx:
    networks:
      sail:
      edge:
        aliases:
          - kursy-walut-nbp_nginx
      app:
        aliases:
          - kursy-walut-nbp_nginx

  app:
    environment:
      APP_URL: ${APP_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      sail:
      app:
        aliases:
          - kursy-walut-nbp_app

networks:
  edge:
    external: true
    name: portfolio_edge
  app:
    external: true
    name: portfolio_app
