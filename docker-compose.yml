services:
  nginx:
    image: nginx:1.27-alpine
    container_name: kursy-walut-nbp-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sail

  app:
    restart: unless-stopped
    build:
      context: ./docker/php/8.2
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: kursy-walut-nbp/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
    volumes:
      - .:/var/www/html
    networks:
      - sail
    container_name: 'kursy-walut-nbp-app'

  # Tylko standalone — w portfolio aplikacja używa współdzielonej bazy Mikrusa (DB_HOST w .env)
  mysql:
    profiles: ["standalone"]
    restart: unless-stopped
    image: 'mysql/mysql-server:8.0'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-}'
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: '${DB_DATABASE:-kursy-walut-nbp}'
      MYSQL_USER: '${DB_USERNAME:-kursy-walut-nbp}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'sail-mysql:/var/lib/mysql'
    networks:
      - sail
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME:-kursy-walut-nbp} --password=${DB_PASSWORD:-} --silent"]
      retries: 3
      timeout: 5s
    container_name: 'kursy-walut-nbp-mysql'

networks:
  sail:
    driver: bridge
volumes:
  sail-mysql:
    driver: local
